[workspace]
resolver = "2"
members = [
    "oikos-syntax",
    "oikos-parser",
    "oikos-desugar",
    "oikos-check",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
rust-version = "1.83"
license    = "MPL-2.0"
authors    = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/oikos-economics-accounting-dsl"
keywords   = ["economics", "stock-flow-consistent", "macroeconomics", "dsl", "ephapax"]
categories = ["compilers", "science"]

[workspace.dependencies]
# ── Internal crates ──────────────────────────────────────────────────────────
oikos-syntax   = { path = "oikos-syntax" }
oikos-parser   = { path = "oikos-parser" }
oikos-desugar  = { path = "oikos-desugar" }
oikos-check    = { path = "oikos-check" }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde          = { version = "1.0", features = ["derive"] }

# ── String interning ─────────────────────────────────────────────────────────
smol_str       = { version = "=0.3.6", features = ["serde"] }

# ── Error handling ────────────────────────────────────────────────────────────
thiserror      = "2"

# ── Lexing / parsing ──────────────────────────────────────────────────────────
logos          = "0.16"
chumsky        = { version = "=1.0.0-alpha.8", default-features = false, features = ["std"] }

# ── Diagnostic reporting ─────────────────────────────────────────────────────

# ── Ephapax IR ────────────────────────────────────────────────────────────────
# NOT blocked on the Ephapax parser any more: as of 2026-09-26 upstream
# `hyperpolymath/ephapax@main` publishes ephapax-parser/-lexer/-surface/
# -syntax/-ir/-typing and records them complete (only the type checker and
# WASM codegen are still in progress). These stay commented out because they
# are path dependencies outside this workspace and the lowering in
# `oikos-desugar` is unimplemented and untested — not because the milestone
# is missing. See issue #60.
# ephapax-ir     = { path = "../ephapax/src/ephapax-ir" }
# ephapax-typing = { path = "../ephapax/src/ephapax-typing" }
