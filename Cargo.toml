[workspace]
resolver = "2"
members = [
    "oikos-syntax",
    "oikos-parser",
    "oikos-desugar",
    "oikos-check",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
rust-version = "1.83"
license    = "MPL-2.0"
authors    = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/oikos-economics-accounting-dsl"
keywords   = ["economics", "stock-flow-consistent", "macroeconomics", "dsl", "ephapax"]
categories = ["compilers", "science"]

[workspace.dependencies]
# ── Internal crates ──────────────────────────────────────────────────────────
oikos-syntax   = { path = "oikos-syntax" }
oikos-parser   = { path = "oikos-parser" }
oikos-desugar  = { path = "oikos-desugar" }
oikos-check    = { path = "oikos-check" }

# ── Serialisation ─────────────────────────────────────────────────────────────
serde          = { version = "1.0", features = ["derive"] }

# ── String interning ─────────────────────────────────────────────────────────
smol_str       = { version = "=0.3.7", features = ["serde"] }

# ── Error handling ────────────────────────────────────────────────────────────
thiserror      = "2"

# ── Lexing / parsing ──────────────────────────────────────────────────────────
logos          = "0.16"
chumsky        = { version = "=1.0.0-alpha.8", default-features = false, features = ["std"] }

# ── Diagnostic reporting ─────────────────────────────────────────────────────

# ── Ephapax IR (parser milestone shipped per oikos-economics-accounting-dsl#60) ───
# Git dependencies per D113 decision in oikos-economics-accounting-dsl#60 comment 6096480288.
# Strike-by: 2026-10-17 (default: git dependency).
ephapax-ir     = { git = "https://github.com/hyperpolymath/ephapax", rev = "08d35e7caebaa337b6606a13b7608bcdcff18ccb" }
ephapax-typing = { git = "https://github.com/hyperpolymath/ephapax", rev = "08d35e7caebaa337b6606a13b7608bcdcff18ccb" }
