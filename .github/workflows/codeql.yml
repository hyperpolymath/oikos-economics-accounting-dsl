# This workflow is managed by gh actions-lock.
name: CodeQL Security Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Applied only to read-only check workflows
# (no publish/mutation), so cancelling a superseded run is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Initialize CodeQL
        # HELD at v4.38.0. v4.38.1 fails GitHub workflow-startup validation
        # estate-wide (rsr-template-repo dependabot HOLD; nexia-list#100) and
        # the bump also drifts from actions.lock, which kills the run before
        # any job is created. Bump only via `gh actions-lock`, and only once
        # upstream verifies green. See .github/dependabot.yml.
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.0 # held with init@ above
        with:
          category: "/language:${{ matrix.language }}"
