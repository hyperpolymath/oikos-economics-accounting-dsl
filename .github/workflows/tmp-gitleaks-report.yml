# SPDX-License-Identifier: MPL-2.0
# TEMPORARY diagnostic workflow — delete after use.
#
# The secret-scanner reusable's new git-history pass (added between standards
# pins 6b38eb5 and da2c748) fails on this repo, but the sandbox driving this
# work cannot read Actions log storage. This workflow reruns the identical
# scan and posts the finding FINGERPRINTS (redacted values) as a PR comment,
# so the correct .gitleaksignore entries can be authored.
#
# No `uses:` on purpose: nothing to lock, checks out via git like
# lock-sync-gate.yml does.
name: tmp-gitleaks-report

on:
  push:
    branches: ['arena/fd4b224f-oikos-economics-accounting-dsl']

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history without actions/checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="${AUTH}" fetch -q origin "${REF}"
          git checkout -q FETCH_HEAD

      - name: Install gitleaks (same pin as the reusable)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Stage estate baseline (same source as the reusable at da2c748)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/hyperpolymath/standards/contents/config/gitleaks/estate-baseline.toml?ref=da2c748aad55c1a1dcba00b60fe4a35017bc6540" \
            -o .gitleaks-estate.toml
          test -s .gitleaks-estate.toml

      - name: History scan, report fingerprints to PR 114
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CONFIG=".gitleaks-estate.toml"
          [ -f .gitleaks.toml ] && CONFIG=".gitleaks.toml"
          set +e
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --config "$CONFIG" \
            --report-format json \
            --report-path /tmp/report.json
          STATUS=$?
          set -e
          {
            echo "## tmp-gitleaks-report (history pass, exit ${STATUS})"
            echo
            echo '```'
            if [ -s /tmp/report.json ]; then
              jq -r '.[] | "\(.RuleID)  \(.File):\(.StartLine)  commit \(.Commit)\n  Fingerprint: \(.Fingerprint)"' /tmp/report.json
            else
              echo "no findings / empty report"
            fi
            echo '```'
          } > /tmp/comment.md
          gh pr comment 114 --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
