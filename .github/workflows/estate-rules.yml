#
# Estate Rules — the repository-shape half of hyperpolymath/standards'
# conventions, enforced where a change is made rather than at the next audit.
#
# Four rules, each with its instrument proved before its verdict is trusted:
#
#   1. Root shape. The repository root is allowlisted bidirectionally by
#      .machine_readable/root-allow.txt and checked by scripts/check-root-shape.sh
#      (adopted verbatim from rsr-template-repo). Issue #109 item 1 exists
#      because this repo had NO allowlist at all: the checker exits 2 on a
#      missing allowlist, which is a setup error, and a setup error on an
#      unadopted gate is indistinguishable from a gate that reports conformance.
#      Absence of red was read as absence of drift for months.
#
#   2. Documentation links. scripts/check-doc-links.sh requires every relative
#      link in a .adoc/.md file to resolve. Relocations (rule 1) and this check
#      are a pair: a move that leaves its inbound links dangling is a
#      half-finished move, and `www/.well-known/security.txt` in this repo
#      pointed at a different repository for months with every gate green.
#
#   3. Lock-sync regressions. tests/test_lock_sync.py plants faults (a replaced
#      validator, a symlink data file, a stale merge ref) and asserts the Lock
#      Sync Gate and scripts/check-lock-sync.sh catch each one. It exists
#      because a gate that has never been seen failing is indistinguishable
#      from a gate that is not wired up; it now has a runner (this step,
#      `just test-lock-sync`, and `just verify`) instead of only a docstring.
#
#   4. REUSE licensing. `reuse lint` must report N/N on BOTH copyright and
#      licence. THE RATIONALE, recorded because this gate is the fix for a
#      measured failure: the repository's only `reuse lint` call lived in
#      ci/.gitlab-ci.yml, which runs only after an out-of-band GitLab project
#      setting (ci/README.adoc) — so REUSE drift read as conformance. That is
#      how issue #109's stale SPDX line and nine stale REUSE.toml annotations
#      licensed nothing for months while every gate stayed green. A gate that
#      cannot run is not a gate; this one runs here, where the PRs are.
#
# The shape and link rules run their own self-test first; the lock-sync suite IS
# its own instrument test. All of them can fail a build — that is only worth
# trusting if they have been seen to fail on a planted fault, which is the
# standard the Lock Sync Gate set in #114 and the template applies to itself in
# .github/workflows/estate-rules.yml.
#
# This workflow deliberately carries NO `uses:` of its own: it checks out by
# calling git in a `run:` step rather than using actions/checkout, so it has no
# entry in .github/workflows/actions.lock to go stale. That is what makes it
# immune to the exact fault it guards (see .github/workflows/lock-sync-gate.yml,
# same design and same reason). Do not add a `uses:` to this file — if a step
# ever needs one, it belongs in a workflow that is not a lockfile gate.
#
# There is also no `paths:` filter, on purpose: a filtered workflow never
# reports on pull requests that miss the filter, which deadlocks any branch
# ruleset that requires this check.

name: Estate Rules

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: estate-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shape:
    name: Root shape and documentation links match canon
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out without actions/checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Header form rather than a token embedded in the remote URL, so the
          # credential is never written into .git/config. An anonymous clone
          # would do for a public repo; this gate must also run on private ones.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="${AUTH}" fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD
          echo "checked out ${SHA}"

      - name: Root-shape gate self-test (a planted stray must fail it)
        run: |
          set -euo pipefail
          test -x scripts/check-root-shape.sh \
            || { echo "::error::scripts/check-root-shape.sh missing or not executable"; exit 1; }
          test -x tests/shape/check_root_shape_test.sh \
            || { echo "::error::tests/shape/check_root_shape_test.sh missing or not executable"; exit 1; }
          ./tests/shape/check_root_shape_test.sh

      - name: Root matches .machine_readable/root-allow.txt
        run: |
          set -euo pipefail
          # Exit codes: 0 conform, 1 drift, 2 setup error (no allowlist). 2 is
          # surfaced as a failure rather than swallowed: an absent allowlist is
          # the state this repository was in, and it must never read as passing.
          ./scripts/check-root-shape.sh .

      - name: Documentation-link gate self-test
        run: |
          set -euo pipefail
          test -x scripts/check-doc-links.sh \
            || { echo "::error::scripts/check-doc-links.sh missing or not executable"; exit 1; }
          ./scripts/check-doc-links.sh --self-test

      - name: Every relative link in the prose resolves
        run: ./scripts/check-doc-links.sh .

      # The contractile's `actions-lock-in-sync` check delegates to
      # scripts/check-lock-sync.sh, whose parser needs 3-argument match() — a GNU
      # extension, so mawk will not do and the script exits FATAL rather than
      # reporting a pass it did not compute. That makes the tool part of THIS
      # gate's contract, not an ambient property of whoever's laptop: under
      # MUST_STRICT a critical check that cannot run fails, so an image without
      # gawk would red the gate for the state of the machine. Provided
      # explicitly, and idempotently, so the run is reproducible on any runner.
      - name: Provide gawk (check-lock-sync.sh needs 3-argument match())
        run: |
          set -euo pipefail
          if command -v gawk >/dev/null 2>&1; then
            echo "gawk already present: $(gawk --version | head -1)"
          else
            sudo apt-get -qq update
            sudo apt-get install -y --no-install-recommends gawk
            command -v gawk >/dev/null || { echo "::error::gawk install produced no gawk"; exit 1; }
            echo "gawk installed for this job: $(gawk --version | head -1)"
          fi

      # tests/test_lock_sync.py is the instrument test for scripts/check-lock-sync.sh
      # and for .github/workflows/lock-sync-gate.yml's trust boundary: it runs the
      # gate's own run-block against fixture repos where the validator has been
      # replaced, the merge ref is stale, or the data file is a symlink, and
      # asserts each planted fault is caught. An obligation with no runner is
      # documentation pretending to be a contract — this is the runner (also
      # `just test-lock-sync` / `just verify`). It calls check-lock-sync.sh and
      # therefore needs the gawk provided above; do not reorder these two steps.
      - name: Lock-sync validator and gate regression suite
        run: |
          set -euo pipefail
          test -f tests/test_lock_sync.py \
            || { echo "::error::tests/test_lock_sync.py missing"; exit 1; }
          python3 -m unittest discover -s tests -v

      # The repository's own contractile, executed. `.machine_readable/contractiles/
      # must/Mustfile.a2ml` used to say "Run with: must check" while no `must`
      # existed here and no step ran it — which is how six of its checks came to
      # name root files that had been deleted or moved. MUST_STRICT=1 makes a
      # check that could not run (missing tool) a violation AT ITS DECLARED
      # SEVERITY: an unevaluated critical fails the run, because in CI "not
      # evaluated" must never be green, while `warning` and `advisory` failures do
      # not block. That distinction is not a softening — the first CI run of this
      # job escalated the contract's own declared-unmet `signed-commits` warning
      # (this repository has no signing key, and the file says so) into a hard
      # failure, which is a gate reporting the state of the machine instead of
      # the state of the repo. Failing checks are also emitted as `::error::` /
      # `::warning::` annotations, so the verdict names its culprit even where the
      # step log is unreachable.
      - name: Mustfile obligations hold (strict)
        env:
          MUST_STRICT: "1"
        run: ./scripts/run-mustfile.sh

      - name: Root-shape allowlist is not silently one-directional
        run: |
          set -euo pipefail
          # Cheap structural check on the allowlist itself: an allowlist with no
          # REQUIRED entries (no line without a leading '?') cannot fail
          # direction 2, so it is a licence to add, not a gate. The template's
          # own file records that this is exactly how its allowlist rotted.
          required=$(sed -E 's/[[:space:]]*#.*$//' .machine_readable/root-allow.txt \
                       | awk 'NF' | grep -vc '^?' || true)
          echo "allowlist: ${required} required entr(y/ies), rest optional"
          test "${required:-0}" -ge 20 \
            || { echo "::error::root-allow.txt has fewer than 20 required entries — a shape gate that requires nothing is not a shape gate"; exit 1; }

      # REUSE 3.x licensing completeness. Installed into a throwaway venv under
      # RUNNER_TEMP rather than via an action: this workflow carries NO `uses:`
      # by design (see the header), and the mandatory empty key
      # '.github/workflows/estate-rules.yml': [] in actions.lock stays correct
      # only while that holds. The [charset-normalizer] extra removes the tool's
      # soft dependency on a system `file(1)` for encoding detection.
      - name: Provide reuse (the fsfe SPDX/REUSE linter)
        run: |
          set -euo pipefail
          if command -v reuse >/dev/null 2>&1; then
            echo "reuse already present: $(reuse --version | head -1)"
          else
            python3 -m venv "${RUNNER_TEMP}/reuse-venv"
            "${RUNNER_TEMP}/reuse-venv/bin/pip" install -q 'reuse[charset-normalizer]'
            test -x "${RUNNER_TEMP}/reuse-venv/bin/reuse" \
              || { echo "::error::reuse install produced no reuse"; exit 1; }
            echo "reuse installed for this job: $("${RUNNER_TEMP}/reuse-venv/bin/reuse" --version | head -1)"
          fi

      # N/N on BOTH copyright and licence, or the job fails. This is the step
      # whose absence let main ship a file with an SPDX licence line and no
      # SPDX-FileCopyrightText (reuse lint at 70422eb: copyright 139/140) while
      # the only gate that could have seen it was a dead GitLab pipeline.
      - name: REUSE lint (licence AND copyright on every file)
        run: |
          set -euo pipefail
          REUSE_BIN="$(command -v reuse || echo "${RUNNER_TEMP}/reuse-venv/bin/reuse")"
          "${REUSE_BIN}" lint
