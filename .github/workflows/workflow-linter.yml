# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'
permissions: read-all
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check SPDX headers
        run: |
          # SCAN THE HEADER COMMENT BLOCK, NOT LINE 1.
          #
          # `gh actions-lock` prepends `# This workflow is managed by gh
          # actions-lock.` to every workflow it mints a lockfile for, which
          # pushes the SPDX identifier to line 2. A `head -1` test therefore
          # fights the estate's own tooling and reports every workflow as
          # unlicensed — 17 of 17 here, exiting 17. The canonical form is
          # rsr-template-repo/.github/workflows/workflow-linter.yml, mirrored
          # by standards' governance-reusable.yml ("Check SPDX headers +
          # permissions"); both read the leading run of comment lines.
          failed=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! awk '/^---[[:space:]]*$/ { next } /^#/ { print; next } { exit }' "$f" \
                 | grep -q "^# SPDX-License-Identifier:"; then
              echo "ERROR: $f has no SPDX-License-Identifier in its header comment block"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "Add '# SPDX-License-Identifier: MPL-2.0' to the leading comment block"
            exit 1
          fi
          echo "All workflows have SPDX headers"
      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      - name: Check pinned actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The lockfile is the pin authority for direct and transitive actions.
          gh extension install github/gh-actions-lock --pin v0.1.6
          gh actions-lock --verify-local
