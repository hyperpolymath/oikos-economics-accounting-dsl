# SPDX-License-Identifier: MPL-2.0
# TEMPORARY issue-ops workflow — delete after use.
#
# The session token driving this work can write contents and pull requests
# but gets 403 on issue writes (the same limitation #108 and #109 record for
# the original filing token). This workflow performs the Phase 3 issue
# hygiene of the #109 ultraplan via the runner token, then is removed.
#
# No `uses:` on purpose: nothing to lock.
name: tmp-issue-ops

on:
  push:
    branches: ['arena/fd4b224f-oikos-economics-accounting-dsl']

permissions:
  contents: read
  issues: write

jobs:
  issue-ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Relabel 60, comment, close 108, progress-note 109
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Idempotence guard: only act once.
          if gh api "repos/$R/issues/60/labels" --jq '.[].name' | grep -q '^status:ready$'; then
            echo "already done; exiting"; exit 0
          fi

          # 1. Relabel #60: blocked -> ready (the ask of #108).
          gh api -X DELETE "repos/$R/issues/60/labels/status%3Ablocked" >/dev/null || true
          gh api -X POST "repos/$R/issues/60/labels" -f "labels[]=status:ready" >/dev/null

          # 2. Evidence + decision proposal on #60.
          gh api -X POST "repos/$R/issues/60/comments" -f body="$(cat <<'EOF'
**Relabelled `status:blocked` → `status:ready`** per the verification in #108 (posted via workflow: the session token, like the original filing token, cannot write to issues).

Verified against `hyperpolymath/ephapax@main` (public, last pushed 2026-10-01): `src/` publishes `ephapax-parser`, `ephapax-lexer`, `ephapax-surface`, `ephapax-syntax`, `ephapax-ir`, `ephapax-typing` (and more); the parser milestone this issue was blocked on has shipped. The upstream **type checker is still in progress**, which affects the `ephapax-typing` re-enable item on this issue's acceptance list — if it is not usable when implementation starts, it gets recorded as explicit debt rather than silently skipped.

**One decision gates implementation — how `ephapax-ir`/`ephapax-typing` reach this workspace.** Proposal, in the applied-unless-struck form (D113 pattern):

> **Default: a cargo git dependency pinned to a SHA** — `ephapax-ir = { git = "https://github.com/hyperpolymath/ephapax", rev = "<sha>" }`. CI-reproducible on any runner, no `../ephapax` sibling-checkout coupling, no premature crates.io publication required upstream, and the pin bumps deliberately like every other pin in the estate.
>
> Alternatives considered: `../ephapax` path dependency (works only where the sibling checkout exists — dev machine yes, CI no, so the workspace would need cfg-gating); vendoring (heavy, duplicates upstream history, and ephapax is moving).

**Strike-by: 2026-10-17.** If unstruck, implementation proceeds on the git-dependency route per the acceptance criteria above.
EOF
          )" >/dev/null

          # 3. Close #108 as completed.
          gh api -X POST "repos/$R/issues/108/comments" -f body="Completed: #60 relabelled \`status:blocked\` → \`status:ready\` with the verification recorded there, and the dependency-route question this issue flagged as owner-gated is now posed on #60 in applied-unless-struck form (default: SHA-pinned cargo git dependency; strike-by 2026-10-17)." >/dev/null
          gh api -X PATCH "repos/$R/issues/108" -f state=closed -f state_reason=completed >/dev/null

          # 4. Progress note on #109.
          gh api -X POST "repos/$R/issues/109/comments" -f body="$(cat <<'EOF'
Progress under ruling D186 and the agreed plan:

- **Items 2 + 3: done.** PR #113 trued up the lockfile after the #112 Dependabot bump had silently killed CI on main (the exact #105 mode this issue predicted — casket-pages startup_failure, ci.yml dead at *Set up job*). PR #114 then, atomically: bumped the five standards reusable pins `6b38eb5` → `da2c748a` (rsr-template-repo's own reviewed pin; brings `actions-lock-verify` + ratchets), closed the lockfile over them with the 9-action transitive closure **re-derived from the reusable YAML at the pinned commit** (including the `github/codeql-action@cdf488f` dangling edge named here), pruned stale orphan leaves, and adopted `lock-sync-gate.yml` + `scripts/check-lock-sync.sh` verbatim from the template. A red rehearsal on the PR branch confirmed the gate actually fails on a desync before it was trusted.
- One surprise from the pin bump: the newer secret-scanner reusable adds a **git-history gitleaks pass** that did not exist at the old pin; it flagged one reviewed false positive (placeholder PEM block in the long-deleted `docs/GITHUB_APP_SETUP.md`, commit b63d0491) — exempted by exact fingerprint in a new `.gitleaksignore`, per the template's own convention for that file.
- **Items 1 (root shape, per D186) + 4 (stale audit doc): next**, as Phase 2 of the plan.
EOF
          )" >/dev/null
          echo "issue ops complete"
