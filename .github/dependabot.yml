version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    ignore:
      # HOLD: github/codeql-action at v4.38.0. v4.38.1 fails GitHub
      # workflow-startup validation estate-wide (rsr-template-repo
      # dependabot HOLD; nexia-list#100/#101/#104), and a grouped bump also
      # drifts from .github/workflows/actions.lock, which Dependabot cannot
      # regenerate — GitHub then rejects the run at startup with ZERO jobs.
      # That is precisely how CI went red on 2026-09-26 (#105).
      # Bump deliberately, via `gh actions-lock`, once upstream verifies
      # green. See .github/workflows/lock-sync-gate.yml.
      - dependency-name: "github/codeql-action"
  
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # `open-pull-requests-limit: 0` suppresses routine version-update PRs
    # while leaving Dependabot SECURITY PRs flowing. The previous
    # `ignore: "*" patch` rule also silenced security PRs under GitHub\'s
    # current Dependabot behaviour. See rsr-template-repo commit 78b050e
    # and 007-lang/audits/audit-dependabot-automation-gap-2026-04-17.md.
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
